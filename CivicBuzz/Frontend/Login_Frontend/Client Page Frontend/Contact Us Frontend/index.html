<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Contact Us | CivicBuzz</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
	<link rel="stylesheet" href="../style.css">
	<link rel="stylesheet" href="style.css">
</head>

<body>

	<main class="contact-page">
		<section class="contact-section">
			<div class="contact-container">

				<div class="contact-intro">
					<span class="eyebrow">CIVICBUZZ</span>
					<h1>Contact Us</h1>
					<p>
						Have a question, suggestion, or need help with CivicBuzz?
						Send us a message and our team will get back to you.
					</p>

					<div class="contact-details">
						<div class="detail-item">
							<div class="detail-icon">✉</div>
							<div>
								<span>Email</span>
								<a href="mailto:support@civicbuzz.in">support@civicbuzz.in</a>
							</div>
						</div>

						<div class="detail-item">
							<div class="detail-icon">☎</div>
							<div>
								<span>Phone</span>
								<a href="tel:+916200000000">+91 62000 00000</a>
							</div>
						</div>

						<div class="detail-item">
							<div class="detail-icon">⌖</div>
							<div>
								<span>Location</span>
								<p>India</p>
							</div>
						</div>
					</div>

					<div class="team-note">
						<strong>CivicBuzz Team</strong>
						<span>Working together for better communities.</span>
					</div>
				</div>

				<div class="contact-form-card">
					<form id="contactForm" novalidate>
						<div class="form-group">
							<label for="name">Name</label>
							<input type="text" id="name" name="name" placeholder="Your name">
							<small class="error" id="nameError"></small>
						</div>

						<div class="form-group">
							<label for="email">Email</label>
							<input type="email" id="email" name="email" placeholder="you@example.com">
							<small class="error" id="emailError"></small>
						</div>

						<div class="form-group">
							<label for="subject">Subject</label>
							<select id="subject" name="subject">
								<option value="">Select a subject</option>
								<option value="General Query">General Query</option>
								<option value="Civic Issue">Civic Issue</option>
								<option value="Feedback">Feedback</option>
								<option value="Technical Support">Technical Support</option>
								<option value="Partnership">Partnership</option>
							</select>
							<small class="error" id="subjectError"></small>
						</div>

						<div class="form-group">
							<label for="message">Message</label>
							<textarea id="message" name="message" rows="5"
								placeholder="Write your message..."></textarea>
							<small class="error" id="messageError"></small>
						</div>

						<button type="submit" class="submit-btn">
							<span>Send Message</span>
							<span class="arrow">→</span>
						</button>

						<p class="form-status" id="formStatus" aria-live="polite"></p>
					</form>
				</div>

			</div>
		</section>
	<div class="toast" id="toast" role="status" aria-live="polite"></div>

	<script src="script.js"></script>
	<script src="../navbar-loader.js"></script>
</body>

</html>
